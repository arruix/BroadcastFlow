openapi: 3.0.3
info:
  title: Campañas API
  version: 0.1.0
  description: >
    Contrato de las primeras historias y de los tres recorridos que no pueden
    quedar a medias: asentar el webhook, contar la visita y emitir el live.
    Las reglas están en analisis-sistema-campanas.md. El token de acceso dura
    15 minutos y no lleva el rol. El servidor lee el rol en cada petición.
servers:
  - url: https://api.example.test/v1
tags:
  - name: identidad
  - name: organizacion
  - name: campana
  - name: aviso
  - name: donacion
  - name: medicion
  - name: envivo
paths:
  /auth/register:
    post:
      tags: [identidad]
      operationId: register
      summary: CU-01 Registrarse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Usuario creado, sin sesión. El correo de verificación sale después del commit.
        "422":
          $ref: "#/components/responses/DomainError"
  /auth/verify:
    post:
      tags: [identidad]
      operationId: verifyEmail
      summary: CU-18 Verificar correo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "204":
          description: Correo verificado.
        "422":
          $ref: "#/components/responses/DomainError"
  /auth/login:
    post:
      tags: [identidad]
      operationId: login
      summary: CU-02 Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token. El refresh viaja en cookie HttpOnly en la web, o en el cuerpo solo para la tableta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/DomainError"
  /auth/refresh:
    post:
      tags: [identidad]
      operationId: refreshSession
      summary: Rota el refresh. Si reaparece uno ya usado, revoca la familia.
      responses:
        "200":
          description: Access token nuevo. La web recibe el refresh en cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/DomainError"
  /auth/logout:
    post:
      tags: [identidad]
      operationId: logout
      summary: Revoca la sesión del refresh.
      responses:
        "204":
          description: Sesión revocada.
  /auth/password/forgot:
    post:
      tags: [identidad]
      operationId: forgotPassword
      summary: CU-17. La respuesta es la misma exista o no la cuenta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: Si la cuenta existe, el enlace dura 1 hora.
  /auth/password/reset:
    post:
      tags: [identidad]
      operationId: resetPassword
      summary: CU-17. Reemplaza el hash y revoca las sesiones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordReset"
      responses:
        "204":
          description: Clave reemplazada.
        "422":
          $ref: "#/components/responses/DomainError"
  /auth/verify/resend:
    post:
      tags: [identidad]
      operationId: resendVerification
      summary: Reenvía el enlace de verificación. La respuesta no revela si el correo existe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "204":
          description: Si la cuenta existe y no está verificada, sale otro enlace.
  /auth/mfa/enroll:
    post:
      tags: [identidad]
      operationId: enrollMfa
      summary: CU-16. Entrega el secreto para enrolar. Todavía no queda activo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticket]
              properties:
                ticket: { type: string }
      responses:
        "200":
          description: Secreto TOTP en base32.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollStart"
        "401":
          $ref: "#/components/responses/DomainError"
  /auth/mfa/confirm:
    post:
      tags: [identidad]
      operationId: confirmMfa
      summary: CU-16. Un código válido guarda el secreto, muestra los ocho códigos y abre sesión.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaConfirm"
      responses:
        "200":
          description: Sesión y códigos de recuperación, una sola vez.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollResult"
        "401":
          $ref: "#/components/responses/DomainError"
  /auth/oauth/{provider}/start:
    post:
      tags: [identidad]
      operationId: startOAuth
      summary: CU-02. URL de autorización con PKCE. No crea usuario.
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      responses:
        "200":
          description: URL y state. El verifier queda cifrado 10 minutos y no se escribe en logs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthStart"
  /auth/oauth/{provider}/callback:
    post:
      tags: [identidad]
      operationId: completeOAuth
      summary: CU-02. Si el subject ya está enlazado, abre sesión. Si no, no crea usuario ni enlaza por correo.
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthComplete"
      responses:
        "200":
          description: Sesión del usuario ya enlazado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "422":
          $ref: "#/components/responses/DomainError"
  /auth/oauth/{provider}/link:
    post:
      tags: [identidad]
      operationId: linkOAuth
      summary: CU-02. Guarda el subject después de entrar con la clave local.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OAuthProvider"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthComplete"
      responses:
        "204":
          description: Subject guardado para ese usuario y ese proveedor.
        "422":
          $ref: "#/components/responses/DomainError"
  /auth/step-up:
    post:
      tags: [identidad]
      operationId: stepUp
      summary: CU-16 Step-up
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, minLength: 6, maxLength: 6 }
      responses:
        "204":
          description: Sesión elevada por 10 minutos.
        "401":
          $ref: "#/components/responses/DomainError"
  /organizations:
    get:
      tags: [organizacion]
      operationId: listOrganizations
      summary: Organizaciones del usuario autenticado.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membresías del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
    post:
      tags: [organizacion]
      operationId: createOrganization
      summary: Alta de la organización en el primer ingreso verificado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, country]
              properties:
                name: { type: string }
                country: { type: string, minLength: 2, maxLength: 2 }
      responses:
        "201":
          description: Organización creada y el usuario queda como owner, con plan fundador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
  /organizations/{organizationId}/members:
    get:
      tags: [organizacion]
      operationId: listMembers
      summary: Miembros e invitaciones pendientes. Owner o admin.
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Equipo de la organización.
  /organizations/{organizationId}/invitations:
    post:
      tags: [organizacion]
      operationId: inviteMember
      summary: Owner o admin invita por correo, con un rol distinto de owner. El enlace dura 7 días.
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Invitación enviada.
  /organizations/{organizationId}/members/{membershipId}:
    delete:
      tags: [organizacion]
      operationId: removeMember
      summary: Owner o admin da de baja a un miembro que no es owner.
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Membresía retirada.
  /invitations/accept:
    post:
      tags: [organizacion]
      operationId: acceptInvitation
      summary: El invitado, con el correo ya verificado, acepta y queda en la organización.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membresía creada.
  /campaigns:
    get:
      tags: [campana]
      operationId: listCampaigns
      summary: Campañas de la organización.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Campañas visibles para el miembro.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Campaign"
        "403":
          $ref: "#/components/responses/DomainError"
    post:
      tags: [campana]
      operationId: createCampaign
      summary: CU-05 Crear campaña. La URL de tienda es CU-23.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignWrite"
      responses:
        "201":
          description: Campaña en borrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "422":
          $ref: "#/components/responses/DomainError"
  /campaigns/{campaignId}:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/OrganizationHeader"
    patch:
      tags: [campana]
      operationId: updateCampaign
      summary: CU-23 Fijar o quitar el enlace de tienda, y el resto de campos de borrador
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignWrite"
      responses:
        "200":
          description: Campaña actualizada. storeUrl null quita el enlace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "422":
          $ref: "#/components/responses/DomainError"
  /campaigns/{campaignId}/activate:
    post:
      tags: [campana]
      operationId: activateCampaign
      summary: Pasa una causa o una comercial de borrador a activa. La electoral sin paquete permanece en borrador.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Campaña activa. Donar sigue apagado hasta que el aviso esté publicado y exista página.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Campaign"
        "422":
          $ref: "#/components/responses/DomainError"
  /campaigns/{campaignId}/privacy-notices:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/OrganizationHeader"
    get:
      tags: [aviso]
      operationId: listPrivacyNotices
      summary: Borradores y versiones publicadas de la campaña.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Versiones, de la más nueva a la más vieja.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrivacyNotice"
    post:
      tags: [aviso]
      operationId: savePrivacyNotice
      summary: CU-21 Guardar borrador. No mide, no cobra y no crea la página de donación.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrivacyNoticeWrite"
      responses:
        "201":
          description: Borrador guardado. publishedAt va vacío.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "422":
          $ref: "#/components/responses/DomainError"
  /campaigns/{campaignId}/privacy-notices/{noticeId}/publish:
    post:
      tags: [aviso]
      operationId: publishPrivacyNotice
      summary: CU-21 Publicar aviso. Retira la versión anterior y crea la página de donación si la campaña no es comercial y el plan tiene donativos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: noticeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Versión publicada. La página de donación queda creada cuando el plan y el tipo lo permiten.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivacyNotice"
        "422":
          $ref: "#/components/responses/DomainError"
  /public/campaigns/{slug}:
    get:
      tags: [aviso]
      operationId: readPublicCampaign
      summary: Landing. El aviso publicado va en el HTML. Sin versión publicada no hay texto ni Donar.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Nombre, aviso publicado si existe, y si Donar está encendido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCampaign"
        "404":
          description: No hay campaña con ese slug.
  /public/campaigns/{slug}/donations:
    post:
      tags: [donacion]
      operationId: startDonation
      summary: CU-09 y CU-14. El servidor fija el monto que va a la pasarela.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonationStart"
      responses:
        "201":
          description: Donación pendiente y secreto de cliente de la pasarela. Sin aviso publicado, 422.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationPending"
        "422":
          $ref: "#/components/responses/DomainError"
  /public/donations/{donationId}:
    get:
      tags: [donacion]
      operationId: readDonationReceipt
      summary: Recibo del donante. fiscalReceipt es false.
      parameters:
        - name: donationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Desglose y estado. El texto fiscal lo muestra la página.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationRecord"
        "404":
          description: Donación inexistente.
  /webhooks/donations:
    post:
      tags: [donacion]
      operationId: settleDonationWebhook
      summary: CU-15. Firma y event_id. Responde después del commit del asiento.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Cuerpo crudo de la pasarela. La API no confía en el monto del cliente.
      responses:
        "200":
          description: Asiento confirmado, o event_id ya visto.
        "400":
          description: Firma o reloj inválidos. El libro no cambia.
        "422":
          description: El monto no cuadra con la donación. No queda asiento.
  /plans:
    get:
      tags: [comercial]
      operationId: listPlans
      summary: Planes que se pueden contratar. El fundador no está a la venta.
      responses:
        "200":
          description: Precio y minutos de live incluidos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlanOffer"
  /subscription:
    get:
      tags: [comercial]
      operationId: readSubscription
      summary: Plan vigente de la organización.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Estado, minutos de live y la última factura.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionView"
  /subscriptions/checkout:
    post:
      tags: [comercial]
      operationId: startPlanCheckout
      summary: CU-04. Abre la factura. El plan no cambia hasta el webhook de billing.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string }
      responses:
        "201":
          description: Factura abierta y URL de pago.
          content:
            application/json:
              schema:
                type: object
                required: [invoiceId, checkoutUrl]
                properties:
                  invoiceId: { type: string, format: uuid }
                  checkoutUrl: { type: string }
        "422":
          $ref: "#/components/responses/DomainError"
  /subscriptions/checkout/result:
    post:
      tags: [comercial]
      operationId: completePlanCheckout
      summary: Resultado local del pago. En producción lo reemplaza el webhook.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceId, outcome]
              properties:
                invoiceId: { type: string, format: uuid }
                outcome: { type: string, enum: [paid, failed] }
      responses:
        "200":
          description: Suscripción después de aplicar el resultado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionView"
  /subscriptions/cancel:
    post:
      tags: [comercial]
      operationId: cancelSubscription
      summary: CU-04a. Corta al fin del periodo. Los datos no se borran.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Sigue usable hasta currentPeriodEnd.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionView"
  /subscriptions/downgrade:
    post:
      tags: [comercial]
      operationId: downgradeSubscription
      summary: Si el uso no cabe en el fundador, el cambio espera al fin del periodo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Plan actual o cambio pendiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionView"
  /invoices/{invoiceId}/cfdi:
    post:
      tags: [comercial]
      operationId: retryInvoiceCfdi
      summary: CU-20. Reintenta el mismo id de factura. No timbra dos veces.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: invoiceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Factura timbrada, o el fallo visible para el owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionView"
  /webhooks/billing:
    post:
      tags: [donacion]
      operationId: settleBillingWebhook
      summary: CU-04 y CU-20. Otro secreto. Al marcar la factura pagada, encola el CFDI.
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Suscripción actualizada. El timbrado sale por el outbox, no dentro de esta respuesta.
        "400":
          description: Firma o reloj inválidos.
  /public/campaigns/{slug}/visits:
    post:
      tags: [medicion]
      operationId: recordVisit
      summary: Beacon del landing. view es la carga de la página. click es el clic en Donar. Solo corre si el aviso está publicado.
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitBeacon"
      responses:
        "204":
          description: Evento guardado. La respuesta no dice si contó, para no orientar a quien prueba el filtro.
        "404":
          description: Campaña inexistente o sin aviso publicado. No se escribe visita.
  /campaigns/{campaignId}/metrics:
    get:
      tags: [medicion]
      operationId: readMetrics
      summary: Tablero. Los porcentajes se calculan en esta lectura.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Cubos del rango. CPC vacío si no hay gasto.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Metrics"
  /campaigns/{campaignId}/spend:
    post:
      tags: [medicion]
      operationId: saveAdSpend
      summary: Gasto de pauta cargado por la organización. No es un asiento del libro. El directo no tiene CPC.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, periodStart, periodEnd, amountMinor, currency]
              properties:
                network: { type: string }
                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                amountMinor: { type: integer, format: int64, minimum: 0 }
                currency: { type: string, minLength: 3, maxLength: 3 }
      responses:
        "201":
          description: Fila nueva. Un periodo cerrado no se edita; el ajuste es otra fila.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSpend"
        "422":
          $ref: "#/components/responses/DomainError"
  /campaigns/{campaignId}/spend/{spendId}/close:
    post:
      tags: [medicion]
      operationId: closeAdSpend
      summary: Cierra el periodo. Después el monto no cambia.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: spendId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Periodo cerrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSpend"
  /campaigns/{campaignId}/spend/{spendId}:
    put:
      tags: [medicion]
      operationId: reviseAdSpend
      summary: Cambia el monto de un periodo abierto.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: spendId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountMinor]
              properties:
                amountMinor: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Monto actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdSpend"
        "422":
          $ref: "#/components/responses/DomainError"
  /organizations/{organizationId}/events:
    get:
      tags: [medicion]
      operationId: organizationEvents
      summary: SSE del tablero y del estado del live. Si se corta, el cliente vuelve a leer.
      security:
        - bearerAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: text/event-stream. Eventos visit.counted y live.destination.
          content:
            text/event-stream:
              schema:
                type: string
  /campaigns/{campaignId}/live:
    get:
      tags: [envivo]
      operationId: readLiveDesk
      summary: Catálogo, minutos restantes y la última sesión. Las redes apagadas traen el motivo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Minutos del mes y redes del catálogo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveDesk"
  /campaigns/{campaignId}/live-sessions:
    post:
      tags: [envivo]
      operationId: openLiveSession
      summary: CU-19, pasos 1 y 2. No abre todavía la emisión en la red.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CampaignId"
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connectionIds]
              properties:
                connectionIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        "201":
          description: Sesión en ready y un destino pending por conexión.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
        "422":
          $ref: "#/components/responses/DomainError"
  /live-sessions/{liveSessionId}/start:
    post:
      tags: [envivo]
      operationId: startLive
      summary: CU-19, pasos 3 a 5. Un destino que falla no apaga a los demás.
      security:
        - bearerAuth: []
      parameters:
        - name: liveSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Token de sala y estado por destino. La llave RTMP no viene en este cuerpo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
        "409":
          description: Esa sesión ya está en vivo.
        "422":
          $ref: "#/components/responses/DomainError"
  /live-sessions/{liveSessionId}/stop:
    post:
      tags: [envivo]
      operationId: stopLive
      summary: CU-19, paso 6.
      security:
        - bearerAuth: []
      parameters:
        - name: liveSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Destinos cerrados y minutos sumados.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live-sessions/{liveSessionId}/origin:
    post:
      tags: [envivo]
      operationId: reportLiveOrigin
      summary: El origen se cortó o volvió. A los 30 segundos sin origen la sala se detiene.
      security:
        - bearerAuth: []
      parameters:
        - name: liveSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [connected]
              properties:
                connected: { type: boolean }
      responses:
        "200":
          description: Estado después de anotar el origen.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /live-sessions/{liveSessionId}:
    get:
      tags: [envivo]
      operationId: readLive
      summary: Estado de la sesión al volver a primer plano.
      security:
        - bearerAuth: []
      parameters:
        - name: liveSessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Estado actual, sin llaves de ingest.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSession"
  /donations/{donationId}/rights:
    post:
      tags: [donacion]
      operationId: donorRights
      summary: CU-22 Acceso, rectificación, cancelación u oposición. Cancelar u oponerse vacía nombre y correo a los cinco años. Antes, rights_retention_active.
      security:
        - bearerAuth: []
      parameters:
        - name: donationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DonorRightsRequest"
      responses:
        "200":
          description: Dato de contacto, o fila anonimizada. Los montos no cambian.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DonationRecord"
        "422":
          $ref: "#/components/responses/DomainError"
  /connections/youtube/start:
    post:
      tags: [distribucion]
      operationId: startYoutubeConnect
      summary: Conecta el canal que va a recibir el live. El token queda cifrado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: URL de autorización del canal.
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
  /connections/youtube/callback:
    post:
      tags: [distribucion]
      operationId: finishYoutubeConnect
      summary: Guarda el canal. Sin el permiso de emisión queda en reautorización.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, channelId, scopes]
              properties:
                state: { type: string }
                channelId: { type: string }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Conexión guardada. El token no viaja en la respuesta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnection"
  /connections/facebook/start:
    post:
      tags: [distribucion]
      operationId: startFacebookConnect
      summary: CU-06. State firmado con la organización. No abre sesión.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: URL de autorización de la Página.
          content:
            application/json:
              schema:
                type: object
                required: [authorizationUrl]
                properties:
                  authorizationUrl: { type: string }
        "422":
          $ref: "#/components/responses/DomainError"
  /connections/facebook/callback:
    post:
      tags: [distribucion]
      operationId: finishFacebookConnect
      summary: CU-06. Guarda el token cifrado. Sin pages_manage_posts la conexión queda en reautorización.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state, pageId, scopes]
              properties:
                state: { type: string }
                pageId: { type: string }
                scopes:
                  type: array
                  items: { type: string }
      responses:
        "200":
          description: Conexión guardada. El token no viaja en la respuesta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SocialConnection"
        "422":
          $ref: "#/components/responses/DomainError"
  /connections:
    get:
      tags: [distribucion]
      operationId: listConnections
      summary: Conexiones de la organización, sin el token.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Páginas conectadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SocialConnection"
  /campaigns/{campaignId}/share:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/OrganizationHeader"
    put:
      tags: [distribucion]
      operationId: saveCampaignShare
      summary: CU-08 ficha. Sin imagen, el enlace se publica sin vista previa.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignShareWrite"
      responses:
        "200":
          description: Ficha guardada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignShare"
        "422":
          $ref: "#/components/responses/DomainError"
  /campaigns/{campaignId}/content-items:
    parameters:
      - $ref: "#/components/parameters/CampaignId"
      - $ref: "#/components/parameters/OrganizationHeader"
    post:
      tags: [distribucion]
      operationId: createContentItem
      summary: CU-07. Crea la pieza. El texto de cada red va en la variante.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Pieza en borrador.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentItem"
    get:
      tags: [distribucion]
      operationId: listContentItems
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Piezas y variantes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentItem"
  /content-items/{contentItemId}/variants:
    post:
      tags: [distribucion]
      operationId: saveContentVariant
      summary: CU-13. Una variante inválida se guarda y no se puede programar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: contentItemId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [network, body]
              properties:
                network: { type: string }
                body: { type: string }
      responses:
        "200":
          description: Variante guardada, válida o no.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentVariant"
        "422":
          $ref: "#/components/responses/DomainError"
  /publications:
    post:
      tags: [distribucion]
      operationId: schedulePublication
      summary: CU-08. Rechaza la variante inválida y la conexión en reautorización.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, connectionId, scheduledAt]
              properties:
                variantId: { type: string, format: uuid }
                connectionId: { type: string, format: uuid }
                scheduledAt: { type: string, format: date-time }
      responses:
        "201":
          description: Fila programada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "422":
          $ref: "#/components/responses/DomainError"
  /organizations/{organizationId}/identity:
    post:
      tags: [libro]
      operationId: verifyIdentity
      summary: CU-10. Sin identidad no hay retiro. Pide step-up.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
        - name: organizationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "201":
          description: Identidad verificada.
        "403":
          $ref: "#/components/responses/DomainError"
  /organizations/{organizationId}/payout-account:
    post:
      tags: [libro]
      operationId: savePayoutAccount
      summary: CU-10. La cuenta destino queda verificada antes del retiro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Cuenta verificada.
  /organizations/{organizationId}/owners:
    post:
      tags: [libro]
      operationId: addSecondOwner
      summary: CU-10. El owner suma un segundo owner, hasta dos, para aprobar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Segundo owner agregado.
  /campaigns/{campaignId}/ledger:
    get:
      tags: [libro]
      operationId: readLedger
      summary: CU-10. Saldo líquido, asientos y dispersiones.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Libro de la campaña.
  /campaigns/{campaignId}/disputes:
    get:
      tags: [libro]
      operationId: listDisputes
      summary: CU-10. Disputas abiertas, con fecha y vencimiento.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Disputas abiertas.
  /campaigns/{campaignId}/payouts:
    post:
      tags: [libro]
      operationId: requestPayout
      summary: CU-10. Por encima de 100000 centavos USD, u otra moneda, queda pedida.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Dispersión pedida o enviada.
  /payouts/{payoutId}/approve:
    post:
      tags: [libro]
      operationId: approvePayout
      summary: CU-10. Otro owner aprueba. Quien la pidió no la aprueba.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Dispersión enviada o fallida con reverso.
  /campaigns/{campaignId}/ledger/report:
    post:
      tags: [libro]
      operationId: requestLedgerReport
      summary: CU-10. La web o la tablet piden el PDF del libro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "201":
          description: Reporte listo.
  /reports/{reportId}:
    get:
      tags: [libro]
      operationId: downloadLedgerReport
      summary: CU-10. PDF del libro.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: application/pdf
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /platform/summary:
    get:
      tags: [plataforma]
      operationId: platformSummary
      summary: Consola del operador. Organizaciones con identidad, campañas, ingreso del mes y pagos atorados.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resumen. El ingreso es suscripción más comisión.
  /platform/organizations:
    get:
      tags: [plataforma]
      operationId: listPlatformOrganizations
      summary: Alta, país, verificación y plan. Sin identidad no se dispersa.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Organizaciones.
    post:
      tags: [plataforma]
      operationId: createPlatformOrganization
      summary: El operador da de alta la organización para un owner. El operador no queda como miembro.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Organización creada, sin identidad.
  /platform/organizations/{organizationId}/support:
    post:
      tags: [plataforma]
      operationId: enterSupportMode
      summary: Modo soporte. El owner ve el acceso y la auditoría guarda quién entró.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Acceso de soporte registrado.
  /platform/campaigns/{campaignId}/pause:
    post:
      tags: [plataforma]
      operationId: pauseCampaignPage
      summary: Con libro no se borra. Se pausa la página.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Campaña pausada. El libro no cambia.
  /platform/income.csv:
    get:
      tags: [plataforma]
      operationId: downloadPlatformIncome
      summary: CSV de suscripciones y comisiones. Sin neto de campañas.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: text/csv
  /platform/webhooks/{webhookId}/retry:
    post:
      tags: [plataforma]
      operationId: retryWebhook
      summary: Reintenta un webhook guardado. No reescribe cifras del libro.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Reintento idempotente.
  /platform/users/{userId}/remove:
    post:
      tags: [plataforma]
      operationId: removePlatformUser
      summary: Con membresías no se elimina.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Cuenta bloqueada, o rechazo si tiene membresías.
        "422":
          $ref: "#/components/responses/DomainError"
  /publications/dispatch:
    post:
      tags: [distribucion]
      operationId: dispatchPublications
      summary: CU-12. Publica las filas vencidas una vez. Un 5xx reintenta. El fallo no borra la pieza.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrganizationHeader"
      responses:
        "200":
          description: Filas tomadas en esta pasada.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Publication"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrganizationHeader:
      name: X-Organization-Id
      in: header
      required: true
      schema: { type: string, format: uuid }
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema: { type: string, format: uuid }
    OAuthProvider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, microsoft] }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8 }
  responses:
    DomainError:
      description: Regla de negocio rechazada. El cuerpo trae el código, no una traza.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DomainError"
  schemas:
    DomainError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          enum:
            - email_taken
            - weak_password
            - token_invalid
            - locked
            - notice_required
            - not_eligible
            - electoral_without_policy
            - store_url_invalid
            - commercial_has_no_donation_page
            - live_minutes_exhausted
            - live_network_unavailable
            - live_unavailable
            - rights_retention_active
            - unbalanced
            - oauth_not_linked
            - slug_taken
            - slug_locked
            - slug_invalid
            - email_unverified
            - invalid_credentials
            - mfa_required
            - mfa_enroll_required
            - oauth_not_configured
            - subject_taken
            - dates_invalid
            - country_invalid
            - timezone_invalid
            - forbidden
            - not_draft
            - idempotency_required
            - rate_limited
            - variant_invalid
            - connection_reauth
            - connection_limit
            - network_unavailable
            - share_invalid
            - image_invalid
            - beacon_invalid
            - spend_invalid
            - subscription_inactive
            - plan_unavailable
            - step_up_required
            - identity_unverified
            - payout_unavailable
            - approval_invalid
            - owner_limit
            - platform_web_only
            - membership_exists
            - account_blocked
            - operator_required
        ticket:
          type: string
          description: Presente cuando el ingreso pide enrolar el segundo factor.
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 12 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
        totp: { type: string, minLength: 6, maxLength: 6 }
        recoveryCode: { type: string }
    SessionResponse:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Segundos. 900. }
        refreshToken:
          type: string
          description: Solo la aplicación de tableta. La web lo recibe en cookie.
    OAuthStart:
      type: object
      required: [authorizationUrl, state]
      properties:
        authorizationUrl: { type: string, format: uri }
        state: { type: string }
    OAuthComplete:
      type: object
      required: [code, state]
      properties:
        code: { type: string }
        state: { type: string }
    PasswordReset:
      type: object
      required: [token, password]
      properties:
        token: { type: string }
        password: { type: string, minLength: 12 }
    MfaEnrollStart:
      type: object
      required: [secret, ticket]
      properties:
        secret: { type: string }
        ticket: { type: string, description: Se usa en la confirmación. Lleva el secreto cifrado. }
    MfaConfirm:
      type: object
      required: [ticket, code]
      properties:
        ticket: { type: string }
        code: { type: string, minLength: 6, maxLength: 6 }
    MfaEnrollResult:
      allOf:
        - $ref: "#/components/schemas/SessionResponse"
        - type: object
          required: [recoveryCodes]
          properties:
            recoveryCodes:
              type: array
              minItems: 8
              maxItems: 8
              items: { type: string }
    Organization:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        role: { type: string }
    CampaignWrite:
      type: object
      required: [name, currency, kind, jurisdiction, timeZone]
      properties:
        name: { type: string }
        goalMinor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        kind: { type: string, enum: [electoral, causa, comercial] }
        jurisdiction: { type: string }
        jurisdictionPolicyId: { type: string, format: uuid }
        timeZone: { type: string }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        slug:
          type: string
          minLength: 3
          maxLength: 60
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          description: Opcional al crear. Si no viene, el sistema lo genera. Queda fijo al publicar el aviso.
        storeUrl:
          type: string
          nullable: true
          description: https obligatorio. null quita el enlace. CU-23.
    Campaign:
      allOf:
        - $ref: "#/components/schemas/CampaignWrite"
        - type: object
          required: [id, status, slug]
          properties:
            id: { type: string, format: uuid }
            slug: { type: string }
            status:
              type: string
              enum: [borrador, en_revision, programada, activa, pausada, cerrada, archivada]
    PrivacyNoticeWrite:
      type: object
      required: [controller, purpose, dataCategories, retention]
      properties:
        controller: { type: string }
        purpose: { type: string }
        dataCategories: { type: string }
        retention: { type: string }
    PrivacyNotice:
      allOf:
        - $ref: "#/components/schemas/PrivacyNoticeWrite"
        - type: object
          required: [id, version]
          properties:
            id: { type: string, format: uuid }
            version: { type: integer }
            publishedAt: { type: string, format: date-time, nullable: true }
    PublicCampaign:
      type: object
      required: [name, slug, status, kind, currency, donateEnabled]
      properties:
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        kind: { type: string, enum: [electoral, causa, comercial] }
        currency: { type: string }
        donateEnabled:
          type: boolean
          description: Verdadero con campaña activa, aviso publicado, página de donación y plan con donativos.
        share:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CampaignShare"
        notice:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/PrivacyNotice"
        live:
          nullable: true
          description: Presente mientras hay una sesión en vivo. El landing cambia el video por este HLS.
          type: object
          required: [playbackUrl]
          properties:
            playbackUrl: { type: string }
    DonationStart:
      type: object
      required: [amountMinor, currency, donorName, donorEmail]
      properties:
        amountMinor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string, minLength: 3, maxLength: 3 }
        donorName: { type: string }
        donorEmail: { type: string, format: email }
        personKind: { type: string, enum: [individual, organization] }
        visitAnonymousId: { type: string, format: uuid }
    DonationPending:
      type: object
      required: [donationId, privacyNoticeId, clientSecret]
      properties:
        donationId: { type: string, format: uuid }
        privacyNoticeId: { type: string, format: uuid }
        clientSecret: { type: string }
    DonationRecord:
      type: object
      required: [id, status, grossMinor, netMinor, processorFeeMinor, platformFeeMinor, currency, privacyNoticeId]
      properties:
        id: { type: string, format: uuid }
        status: { type: string }
        grossMinor: { type: integer, format: int64 }
        netMinor: { type: integer, format: int64 }
        processorFeeMinor: { type: integer, format: int64 }
        platformFeeMinor: { type: integer, format: int64 }
        currency: { type: string }
        privacyNoticeId: { type: string, format: uuid }
        donorName: { type: string, nullable: true }
        donorEmail: { type: string, nullable: true }
        anonymizedAt: { type: string, format: date-time, nullable: true }
        fiscalReceipt: { type: boolean, description: Siempre false. No es CFDI deducible. }
    DonorRightsRequest:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [access, rectify, cancel, oppose] }
        donorName: { type: string }
        donorEmail: { type: string, format: email }
    SocialConnection:
      type: object
      required: [id, network, externalAccountId, status]
      properties:
        id: { type: string, format: uuid }
        network: { type: string }
        externalAccountId: { type: string }
        status: { type: string, enum: [active, reauth] }
    CampaignShareWrite:
      type: object
      required: [title, description]
      properties:
        title: { type: string }
        description: { type: string }
        imageKey:
          type: string
          nullable: true
          description: https. null publica el enlace sin vista previa.
    CampaignShare:
      allOf:
        - $ref: "#/components/schemas/CampaignShareWrite"
    ContentVariant:
      type: object
      required: [id, network, body, valid]
      properties:
        id: { type: string, format: uuid }
        network: { type: string }
        body: { type: string }
        valid: { type: boolean }
    ContentItem:
      type: object
      required: [id, status, variants]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [borrador, en_revision, aprobada] }
        variants:
          type: array
          items:
            $ref: "#/components/schemas/ContentVariant"
    Publication:
      type: object
      required: [id, status, scheduledAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [scheduled, sending, published, failed, canceled] }
        scheduledAt: { type: string, format: date-time }
        variantId: { type: string, format: uuid }
        connectionId: { type: string, format: uuid }
    PlanOffer:
      type: object
      required: [code, priceMinor, currency, liveMinutesIncluded]
      properties:
        code: { type: string }
        priceMinor: { type: integer, format: int64 }
        currency: { type: string }
        liveMinutesIncluded: { type: integer }
        campaignLimit: { type: integer, nullable: true }
        connectionLimit: { type: integer, nullable: true }
        platformFeeBps: { type: integer, description: Comisión de la plataforma sobre el bruto, en diezmilésimas. }
    SubscriptionView:
      type: object
      required: [plan, status, liveMinutesIncluded, cancelAtPeriodEnd]
      properties:
        plan: { type: string }
        status: { type: string, enum: [internal, incomplete, active, past_due, canceled] }
        liveMinutesIncluded: { type: integer }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        pendingPlan: { type: string, nullable: true }
        invoice:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            status: { type: string }
            cfdiStatus: { type: string, enum: [not_required, pending, stamped, failed] }
            cfdiUuid: { type: string, format: uuid, nullable: true }
    VisitBeacon:
      type: object
      required: [anonymousId, eventType]
      properties:
        anonymousId: { type: string, format: uuid }
        eventType:
          type: string
          enum: [view, click]
          description: view es la carga del landing. click es el clic en Donar.
        referrer: { type: string }
        utmSource: { type: string }
    AdSpend:
      type: object
      required: [id, network, amountMinor, closed]
      properties:
        id: { type: string, format: uuid }
        network: { type: string }
        amountMinor: { type: integer, format: int64 }
        closed: { type: boolean }
    Metrics:
      type: object
      required: [origins, excludedCount, cpcVisible, series]
      properties:
        excludedCount: { type: integer }
        cpcVisible: { type: boolean, description: Verdadero para owner y admin. }
        series:
          type: array
          items:
            type: object
            required: [day, views, clicks]
            properties:
              day: { type: string, format: date }
              views: { type: integer }
              clicks: { type: integer }
        origins:
          type: array
          items:
            type: object
            required: [origin, views, viewShare, clicks, clickRate, donations, donationRate]
            properties:
              origin: { type: string }
              views: { type: integer }
              viewShare: { type: number, description: Calculado al leer. }
              clicks: { type: integer }
              clickRate: { type: number, description: Clics en Donar de esa red / vistas de esa red. }
              donations: { type: integer }
              donationRate: { type: number }
              cpcMinor:
                type: integer
                nullable: true
                description: Gasto de esa red / clics en Donar. Vacío si no hay fila de gasto. Solo owner y admin. El directo no tiene CPC.
    LiveDesk:
      type: object
      required: [minutesIncluded, secondsUsed, secondsRemaining, networks, connections]
      properties:
        minutesIncluded: { type: integer }
        secondsUsed: { type: integer }
        secondsRemaining: { type: integer }
        networks:
          type: array
          items:
            type: object
            required: [code, liveMode]
            properties:
              code: { type: string }
              liveMode: { type: string, enum: [on, off, unavailable, out] }
              reason: { type: string, nullable: true }
        connections:
          type: array
          items:
            $ref: "#/components/schemas/SocialConnection"
        session:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/LiveSession"
    LiveSession:
      type: object
      required: [id, status, destinations]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ready, live, ended, failed] }
        roomToken:
          type: string
          description: Presente al iniciar. No incluye la llave RTMP.
        playbackUrl: { type: string }
        destinations:
          type: array
          items:
            type: object
            required: [connectionId, network, status]
            properties:
              connectionId: { type: string, format: uuid }
              network: { type: string }
              status: { type: string, enum: [pending, live, failed, ended] }
              failureReason: { type: string }
